[package]
name = "mtga-sleuth"
version = "0.1.0"
edition = "2021"
description = "Local MTG Arena tracker for Linux: live deck tracker, match history, draft helper, collection viewer"
license = "MIT"
build = "build.rs"

[features]
default = []
# Bundle a snapshot of Scryfall's filtered Arena card data into the binary at
# build time. Used by release builds so freshly-installed users have card names
# and images on first launch without an extra ~8 MB download. The build script
# fetches the data from Scryfall during compilation, so an internet connection
# is required when building with this feature.
bundled-cards = []

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["trace", "cors", "fs"] }

sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "macros", "chrono", "json", "migrate"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

anyhow = "1"
thiserror = "2"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "gzip"] }

chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"

directories = "6"
regex = "1"
clap = { version = "4", features = ["derive", "env"] }

rust-embed = { version = "8", features = ["mime-guess"] }
mime_guess = "2"

once_cell = "1"

[build-dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
