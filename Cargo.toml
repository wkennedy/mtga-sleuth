[package]
name = "mtga-tracker"
version = "0.1.0"
edition = "2021"
description = "Local MTG Arena tracker for Linux: live deck tracker, match history, draft helper, collection viewer"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
axum = { version = "0.7", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "fs"] }

sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "macros", "chrono", "json", "migrate"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

anyhow = "1"
thiserror = "1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip"] }

chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
async-stream = "0.3"

directories = "5"
regex = "1"
clap = { version = "4", features = ["derive", "env"] }

rust-embed = { version = "8", features = ["mime-guess"] }
mime_guess = "2"

dashmap = "6"
once_cell = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
